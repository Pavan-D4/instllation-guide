apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: my-cluster-rolebinding
subjects:
  - kind: ServiceAccount
    name: my-serviceaccount               # Name of the service account
    namespace: dev                        # Namespace where the service account exists
roleRef:
  kind: ClusterRole
  name: my-cluster-role                   # Name of the ClusterRole to bind
  apiGroup: rbac.authorization.k8s.io
