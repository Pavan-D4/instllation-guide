apiVersion: v1
kind: Service
metadata: 
  name: clusterip-service
  namespace: dev
  labels:
    app: nginx
  annotations:
    description: "this is clusterip service created for dev env"
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 5051
      targetPort: 5051
