apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-with-antiaffinity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-antiaffinity
  template:
    metadata:
      labels:
        app: test-antiaffinity
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: "kubernetes.io/hostname"
            labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - test-antiaffinity
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
